---
name: Test

on:
  schedule:
    - cron: '0 6 * * 5' # Every Friday at 6am UTC, to detect anton.app API changes
  workflow_dispatch:
  pull_request:
  # Codecov compares pull requests against the coverage report of main.
  push:
    branches:
      - main

permissions: {}

jobs:
  # All runs share one live anton.app account and pin the same blocks, so only
  # one run at a time may run the live tests. Pull requests from forks don't get
  # the secrets and skip the wait: they only run the offline unit tests.
  boarding-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  test:
    needs: boarding-gate
    # A skipped job counts as passed for required checks. Run the job even if
    # boarding-gate failed and fail it in the first step. For forks the wait
    # is skipped and ANTON_LOGIN_CODE is empty, so vitest skips the live tests.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test:coverage
        env:
          ANTON_LOGIN_CODE: ${{ secrets.ANTON_LOGIN_CODE }}
          ANTON_GROUP: Test

      # For forks the action uploads without a token instead of OIDC.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It is skipped along with the tests and passes with a warning
  # if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [boarding-gate, test]
    # !cancelled(): boarding-gate is skipped for forks.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  qlty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [boarding-gate, test, coverage, actions, qlty]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
