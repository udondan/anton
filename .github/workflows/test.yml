---
name: Test

on:
  schedule:
    - cron: '0 6 * * 5' # Every Friday at 6am UTC, to detect anton.app API changes
  workflow_dispatch:
  pull_request:
  # Codecov compares pull requests against the coverage report of main.
  push:
    branches:
      - main

permissions: {}

jobs:
  # All runs share one live anton.app account and pin the same blocks, so only
  # one run at a time may run the live tests. Pull requests from forks don't get
  # the secrets and skip the wait: they only run the offline unit tests.
  boarding-gate:
    name: Queue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  # The tests only run if code or build config changed. Skipped outside of
  # pull requests, so pushes to main, the weekly schedule and
  # workflow_dispatch always run them. Waits for boarding-gate like everything
  # else: while another run holds the turn, this one likely needs a rebase
  # anyway.
  changes:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files via the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - src/**
              - test/**
              - package.json
              - bun.lock
              - mise.toml
              - tsconfig*.json
              - eslint.config.js
              - .prettierrc.json
              - vitest.config.ts
              - Dockerfile
              - .dockerignore
              - docker-mcp.yml
              - .github/workflows/test.yml

  test:
    needs: [boarding-gate, changes]
    # A skipped job counts as passed for required checks. Run the job even if
    # boarding-gate failed and fail it in the first step. For forks the wait
    # is skipped and ANTON_LOGIN_CODE is empty, so vitest skips the live tests.
    # Skip it if no code changed.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun # versions from mise.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      # Lints the tool descriptions the MCP server lists with the deterministic
      # checks of Glama's Tool Definition Quality Score (TDQS). Warnings fail
      # the step, notes only go into the summary.
      - name: Lint the MCP tool descriptions
        run: |
          status=0
          bun run lint:tools --format markdown --output tdqs.md || status=$?
          cat tdqs.md
          cat tdqs.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Test
        run: bun run test:coverage
        env:
          ANTON_LOGIN_CODE: ${{ secrets.ANTON_LOGIN_CODE }}
          ANTON_GROUP: Test

      # For forks the action uploads without a token instead of OIDC.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It is skipped along with the tests and passes with a warning
  # if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [boarding-gate, test]
    # !cancelled(): boarding-gate is skipped for forks.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  actions:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  qlty:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@a46e29cfd54065ae8a2c6b1fd3446aed1b1a4257 # v2.8.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  # Checks server.json with the validation endpoint of the MCP Registry.
  mcp-registry:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

  # Builds the image and runs the CLI in it without network access, so nothing
  # reaches anton.app. `anton mcp` starts and lists its tools without
  # credentials and only checks them on the first tool call. The local
  # assignment commands need no login and show that a volume on
  # ~/.config/anton is writable for the user of the image. Only runs if the
  # tests passed, which also means code or the image changed.
  docker:
    name: Docker
    needs: [boarding-gate, test]
    # !cancelled(): boarding-gate is skipped for forks.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun # versions from mise.toml

      # Strict install from the lock file before docker-build compiles dist/.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - run: mise run docker-build

      - name: Run the CLI in the image
        run: |
          docker run --rm --network none udondan/anton --version
          docker run --rm --network none udondan/anton --help

      # Initializes the MCP server, lists its tools and calls one, which has to
      # report the missing credentials. stdin ends after the last request, which
      # stops the server.
      - name: Start the MCP server without credentials
        run: |
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            echo '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_status","arguments":{}}}'
          } | timeout 60 docker run -i --rm --network none udondan/anton | tee mcp.jsonl
          jq -es 'map(select(.id == 2)) | .[0].result.tools | length > 0' mcp.jsonl
          jq -es 'map(select(.id == 3)) | .[0].result | .isError and (.content[0].text | contains("No credentials configured"))' mcp.jsonl

      - name: Keep local assignments in a volume
        run: |
          docker volume create anton-ci
          docker run --rm --network none -v anton-ci:/home/node/.config/anton udondan/anton \
            assign Test c-mat-4/ci --title CI
          docker run --rm --network none -v anton-ci:/home/node/.config/anton udondan/anton \
            assignments --child Test | tee assignments.json
          jq -e 'length == 1 and .[0].fileId == "c-mat-4/ci"' assignments.json

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [boarding-gate, changes, test, coverage, actions, qlty, mcp-registry, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
