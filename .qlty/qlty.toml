config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/.claude/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "block"

# osv-scanner and trivy read bun.lock, but qlty's default file types don't
# include it, so neither scanner would run on this project's lockfile.
[file_types.osv-scanner]
globs = ["**/bun.lock"]

[file_types.lockfile]
globs = ["**/bun.lock"]

[[source]]
name = "default"
default = true

# Bugs, security hotspots and complexity in the TypeScript sources and tests.
[[plugin]]
name = "radarlint-js"

# Known vulnerabilities in the dependencies (bun.lock).
[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "trivy"

# Committed secrets.
[[plugin]]
name = "gitleaks"

[[plugin]]
name = "trufflehog"

# `(string & {})` keeps editor completion for the known roles while still
# accepting any string the API may return.
[[triage]]
match.rules = ["radarlint-js:typescript:S4335"]
match.file_patterns = ["src/types.ts"]
set.ignored = true

# The test throws a string on purpose to cover the non-Error branch.
[[triage]]
match.rules = ["radarlint-js:typescript:S3696"]
match.file_patterns = ["test/config-file.test.ts"]
set.ignored = true
